<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CarConnect QR</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #18202b 0%, #080b10 45%, #050608 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo-box {
            width: 58px;
            height: 58px;
            margin: auto;
            border-radius: 16px;
            background: #fff;
            color: #080b10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 800;
            box-shadow: 0 10px 35px rgba(255,255,255,0.08);
        }

        .brand {
            margin-top: 12px;
            font-size: 23px;
            font-weight: 800;
        }

        .subtitle {
            color: #8e98a8;
            font-size: 14px;
            margin-top: 5px;
        }

        .card {
            background: rgba(15, 19, 26, 0.94);
            border: 1px solid #242b35;
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.35);
        }

        .card h1 {
            font-size: 25px;
            margin-bottom: 7px;
        }

        .card-subtitle {
            color: #8e98a8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            background: #0a0e13;
            border: 1px solid #242b35;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 22px;
        }

        .tab {
            width: 50%;
            padding: 11px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: #8e98a8;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .tab.active {
            background: #fff;
            color: #080b10;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #b9c1cc;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 11px;
            border: 1px solid #2b333e;
            background: #0a0e13;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #66717f;
        }

        .phone-box {
            display: flex;
            gap: 8px;
        }

        .country-code {
            width: 72px;
            text-align: center;
        }

        .phone-input {
            flex: 1;
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: #fff;
            color: #080b10;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }

        .main-btn:hover {
            opacity: 0.9;
        }

        .secondary-btn {
            width: 100%;
            padding: 13px;
            border: 1px solid #2b333e;
            border-radius: 11px;
            background: transparent;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        .message {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }

        .success {
            color: #7ee2a8;
        }

        .error {
            color: #ff8585;
        }

        .hidden {
            display: none;
        }

        .privacy {
            text-align: center;
            color: #697383;
            font-size: 12px;
            margin-top: 18px;
            line-height: 1.5;
        }

        .back {
            display: block;
            text-align: center;
            color: #8e98a8;
            text-decoration: none;
            font-size: 13px;
            margin-top: 18px;
        }

        .back:hover {
            color: #fff;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-box">CQ</div>
        <div class="brand">CarConnect QR</div>
        <div class="subtitle">Smart vehicle contact. Private by design.</div>
    </div>

    <div class="card">

        <h1>Owner Login</h1>
        <p class="card-subtitle">
            Manage your vehicle QR and receive alerts.
        </p>

        <div class="tabs">
            <button class="tab active" id="emailTab" onclick="showEmail()">
                Email
            </button>

            <button class="tab" id="phoneTab" onclick="showPhone()">
                Mobile OTP
            </button>
        </div>

        <!-- EMAIL LOGIN -->

        <div id="emailSection">

            <div class="input-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                >
            </div>

            <button class="main-btn" onclick="emailLogin()">
                Login with Email
            </button>

            <button class="secondary-btn" onclick="emailSignup()">
                Create Owner Account
            </button>

        </div>


        <!-- PHONE LOGIN -->

        <div id="phoneSection" class="hidden">

            <div class="input-group">
                <label>Mobile Number</label>

                <div class="phone-box">

                    <input
                        class="country-code"
                        value="+91"
                        readonly
                    >

                    <input
                        class="phone-input"
                        type="tel"
                        id="phone"
                        maxlength="10"
                        placeholder="10-digit mobile number"
                    >

                </div>
            </div>

            <button class="main-btn" onclick="sendOTP()">
                Send OTP
            </button>

            <div id="otpSection" class="hidden">

                <div class="input-group" style="margin-top:18px;">
                    <label>Enter OTP</label>

                    <input
                        type="text"
                        id="otp"
                        maxlength="6"
                        inputmode="numeric"
                        placeholder="6-digit OTP"
                    >
                </div>

                <button class="main-btn" onclick="verifyOTP()">
                    Verify OTP
                </button>

            </div>

        </div>

        <div id="message" class="message"></div>

        <div class="privacy">
            🔒 Your mobile number is not shown to QR scanners.
        </div>

    </div>

    <a href="index.html" class="back">
        ← Back to CarConnect QR
    </a>

</div>


<script>

const SUPABASE_URL =
    "https://bannrfwcahnvmsrqlnaz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ZC5CnukY1WzRYnLpQF92Sw_nGKZ8Eqh";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


function showMessage(text, type = "") {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;
}


function showEmail() {

    document.getElementById("emailSection")
        .classList.remove("hidden");

    document.getElementById("phoneSection")
        .classList.add("hidden");

    document.getElementById("emailTab")
        .classList.add("active");

    document.getElementById("phoneTab")
        .classList.remove("active");

    showMessage("");
}


function showPhone() {

    document.getElementById("emailSection")
        .classList.add("hidden");

    document.getElementById("phoneSection")
        .classList.remove("hidden");

    document.getElementById("emailTab")
        .classList.remove("active");

    document.getElementById("phoneTab")
        .classList.add("active");

    showMessage("");
}


async function emailSignup() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {

        showMessage(
            "Email aur password dono enter karo.",
            "error"
        );

        return;
    }

    if (password.length < 6) {

        showMessage(
            "Password minimum 6 characters ka hona chahiye.",
            "error"
        );

        return;
    }

    showMessage("Creating your account...");

    const {
        data,
        error
    } = await supabaseClient.auth.signUp({
        email: email,
        password: password
    });

    if (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;
    }

    if (data.user) {

        showMessage(
            "Account created successfully. Logging you in...",
            "success"
        );

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1000);
    }
}


async function emailLogin() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {

        showMessage(
            "Email aur password enter karo.",
            "error"
        );

        return;
    }

    showMessage("Logging in...");

    const {
        data,
        error
    } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;
    }

    if (data.user) {

        showMessage(
            "Login successful! Opening dashboard...",
            "success"
        );

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 700);
    }
}


async function sendOTP() {

    let phone =
        document.getElementById("phone").value.trim();

    phone = phone.replace(/\D/g, "");

    if (phone.length !== 10) {

        showMessage(
            "Valid 10-digit mobile number enter karo.",
            "error"
        );

        return;
    }

    phone = "+91" + phone;

    showMessage("Sending OTP...");

    const {
        error
    } = await supabaseClient.auth.signInWithOtp({
        phone: phone
    });

    if (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;
    }

    document.getElementById("otpSection")
        .classList.remove("hidden");

    showMessage(
        "OTP sent successfully. SMS check karo.",
        "success"
    );
}


async function verifyOTP() {

    let phone =
        document.getElementById("phone").value.trim();

    phone = phone.replace(/\D/g, "");

    const token =
        document.getElementById("otp").value.trim();

    if (phone.length !== 10) {

        showMessage(
            "Mobile number check karo.",
            "error"
        );

        return;
    }

    if (token.length !== 6) {

        showMessage(
            "6-digit OTP enter karo.",
            "error"
        );

        return;
    }

    phone = "+91" + phone;

    showMessage("Verifying OTP...");

    const {
        data,
        error
    } = await supabaseClient.auth.verifyOtp({
        phone: phone,
        token: token,
        type: "sms"
    });

    if (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;
    }

    if (data.user) {

        showMessage(
            "OTP verified! Opening dashboard...",
            "success"
        );

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 700);
    }
}

</script>

</body>
</html>
